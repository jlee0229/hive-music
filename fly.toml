# Deploy from the repo root: `fly deploy` (fly.toml lives here so every fly command works with no flags).
# Keep auto_stop off so the room survives idle minutes. One machine only: rooms are in memory.
# The Docker build context is the repo root (the Dockerfile copies the whole workspace and runs apps/server/src/index.ts).

app = "hivemusic-server"
primary_region = "bos"

[build]
  dockerfile = "infra/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
