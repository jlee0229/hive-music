name: CI

# Three jobs, the same gates a developer runs locally (README "Testing"):
#   check  typecheck + lint + unit tests + the production web build       (blocking)
#   e2e    the Playwright suite against the mock server + stub engine      (see the note on the job)
#   image  builds the server image and smoke-tests it (infra/smoke-test.sh) (blocking)
# Nothing here deploys. Deploys are manual: docs/13-operations.md.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with `packageManager` in package.json and BUN_VERSION in infra/Dockerfile;
  # scripts/check-versions.ts (run in the check job) fails when they drift.
  BUN_VERSION: "1.4.2"

jobs:
  check:
    name: typecheck · lint · unit · web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Version pins agree
        run: bun scripts/check-versions.ts

      - name: Generate synthetic fixtures
        run: bun run fixtures

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      # Catches what `tsc --noEmit` does not (a type-declaration visibility bug surfaced only here).
      - name: Production web build
        run: bun run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NON-BLOCKING ON PURPOSE, FOR NOW. When this job was added, 4 of the 40 specs failed on the
    # base branch (evidence F4, f4-hive-map, host-demotion-recovery, screen) and were being fixed
    # in parallel. Until they are, a failure here shows as a red job with traces attached but does
    # not fail the run. Once the suite is green on main, DELETE the next line to make it a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Playwright and `next dev` run under node (the suite must not be run with `bun x playwright`).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate synthetic fixtures
        run: bun run fixtures

      - name: Install Chromium
        working-directory: apps/web
        run: node ../../node_modules/@playwright/test/cli.js install --with-deps chromium

      # Starts its own `next dev` (stub engine) and its own mock servers: apps/web/playwright.config.ts.
      - name: Run the suite
        working-directory: apps/web
        run: node ../../node_modules/@playwright/test/cli.js test

      - name: Upload traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: server image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test the image
        run: sh infra/smoke-test.sh
