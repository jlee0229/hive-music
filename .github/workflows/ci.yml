name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: install · fixtures · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # No --frozen-lockfile until bun.lock is committed on main.
      - name: Install
        run: bun install

      - name: Generate synthetic fixtures
        run: bun run fixtures

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
